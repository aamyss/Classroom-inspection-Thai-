<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตรวจความสะอาดห้องเรียน</title>
<meta name="theme-color" content="#0B6E6E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ตรวจห้อง">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #0B6E6E; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); box-sizing: border-box; }
  #app { display: block; width: 100%; height: 100%; border: 0; background: #F2F5F4; }
  #wait { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; color: #fff; font: 16px system-ui, sans-serif; text-align: center; padding: 24px; }
  #wait img { width: 96px; height: 96px; border-radius: 22px; }
  #wait a { color: #fff; }
  #slow { display: none; font-size: 14px; opacity: .9; }
</style>
</head>
<body>
<div id="wait">
  <img src="icon-192.png" alt="">
  <div>กำลังเปิดระบบตรวจความสะอาด…</div>
  <div id="slow">ถ้ารอนานเกินไป <a id="direct" href="#" target="_blank" rel="noopener">กดเปิดแบบปกติ</a></div>
</div>
<iframe id="app" title="ระบบตรวจความสะอาดห้องเรียน" allow="camera; clipboard-write"></iframe>
<script>
  // ===== ลิงก์เว็บแอป Apps Script (ถ้า Deploy ใหม่แล้วได้ลิงก์ใหม่ ให้แก้บรรทัดนี้บรรทัดเดียว) =====
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzYaE-V6_e7lAspCCSH_u7qRoiWFwjM1Jd5SNG9aHlZTLU5rYKrKcc9PWWfC_anwC8p/exec';

  // ส่งต่อพารามิเตอร์ เช่น ?page=admin
  var url = APP_URL + (location.search || '');
  var frame = document.getElementById('app');
  document.getElementById('direct').href = url;
  frame.addEventListener('load', function () { document.getElementById('wait').style.display = 'none'; });
  setTimeout(function () { document.getElementById('slow').style.display = 'block'; }, 10000);
  frame.src = url;
</script>
</body>
</html>
